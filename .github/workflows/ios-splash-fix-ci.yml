name: iOS splash watchdog validation

on:
  push:
    branches:
      - fix/ios-splash-watchdog
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright WebKit
        run: pnpm exec playwright install --with-deps webkit

      - name: Mobile stalled-splash regression
        run: pnpm exec playwright test playwright/smoke.spec.ts --project=mobile --grep="الهاتف يخرج من شاشة البداية|الهاتف يعرض إعادة المحاولة"

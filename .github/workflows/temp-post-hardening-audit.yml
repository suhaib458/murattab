name: Temporary post-hardening audit

on:
  push:
    branches:
      - audit/security-post-hardening-2026-09-21

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify live security headers
        shell: bash
        run: |
          curl -sS -I https://murattab-pi.vercel.app/ > /tmp/headers.txt
          python - <<'PY'
          headers={}
          for line in open("/tmp/headers.txt",encoding="utf-8",errors="ignore"):
              if ":" in line:
                  k,v=line.split(":",1)
                  headers[k.strip().lower()]=v.strip()
          wanted=[
              "strict-transport-security",
              "content-security-policy",
              "x-content-type-options",
              "x-frame-options",
              "referrer-policy",
              "permissions-policy",
              "cross-origin-opener-policy",
              "cross-origin-resource-policy",
              "x-powered-by"
          ]
          for key in wanted:
              print(f"HEADER_{key.upper().replace('-','_')}={headers.get(key,'MISSING')}")
          PY

      - name: Verify Smart Import origin boundary
        shell: bash
        run: |
          CROSS_STATUS=$(curl -sS -o /tmp/cross.json -w "%{http_code}" \
            -X POST https://murattab-pi.vercel.app/api/schedule/extract \
            -H "Origin: https://evil.example" \
            -H "X-Murattab-Client: web" \
            -F "consent=false")
          SAME_STATUS=$(curl -sS -o /tmp/same.json -w "%{http_code}" \
            -X POST https://murattab-pi.vercel.app/api/schedule/extract \
            -H "Origin: https://murattab-pi.vercel.app" \
            -H "X-Murattab-Client: web" \
            -F "consent=false")
          echo "AI_CROSS_ORIGIN_STATUS=$CROSS_STATUS"
          echo "AI_SAME_ORIGIN_INVALID_CONSENT_STATUS=$SAME_STATUS"
          test "$CROSS_STATUS" = "403"
          test "$SAME_STATUS" = "400"

      - name: OWASP ZAP passive baseline
        shell: bash
        run: |
          docker run --rm -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://murattab-pi.vercel.app/ -m 2 -I || true

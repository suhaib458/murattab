name: Temporary security audit

on:
  push:
    branches:
      - audit/security-2026-09-21

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Dependency vulnerability audit
        shell: bash
        run: |
          pnpm audit --prod --json > /tmp/pnpm-audit.json || true
          python - <<'PY'
          import json
          p="/tmp/pnpm-audit.json"
          try:
              data=json.load(open(p,encoding="utf-8"))
          except Exception as e:
              print("DEPENDENCY_AUDIT_PARSE_ERROR", type(e).__name__)
              raise SystemExit(0)
          meta=data.get("metadata",{})
          vulns=meta.get("vulnerabilities",{}) if isinstance(meta,dict) else {}
          if vulns:
              print("DEPENDENCY_VULNERABILITIES", json.dumps(vulns, sort_keys=True))
          advisories=data.get("advisories",{})
          if isinstance(advisories,dict):
              severities={}
              for adv in advisories.values():
                  sev=str(adv.get("severity","unknown"))
                  severities[sev]=severities.get(sev,0)+1
              print("DEPENDENCY_ADVISORIES", json.dumps(severities, sort_keys=True))
          if not vulns and not advisories:
              print("DEPENDENCY_AUDIT_NO_KNOWN_VULNERABILITIES")
          PY

      - name: Scan git history for high-confidence secret patterns
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess
          history=subprocess.check_output(
              ["git","log","-p","--all","--no-color","--pretty=format:"],
              text=True, errors="ignore"
          )
          patterns={
              "supabase_secret_key": r"sb_secret_[A-Za-z0-9_-]{20,}",
              "google_api_key": r"AIza[0-9A-Za-z_-]{30,}",
              "private_key_block": r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
              "gemini_env_value": r"(?m)^\+?GEMINI_API_KEY[ \t]*=[ \t]*([^\r\n#]+)$",
              "supabase_service_env_value": r"(?m)^\+?SUPABASE_SERVICE_ROLE_KEY[ \t]*=[ \t]*([^\r\n#]+)$",
              "vapid_private_env_value": r"(?m)^\+?VAPID_PRIVATE_KEY[ \t]*=[ \t]*([^\r\n#]+)$",
          }
          total=0
          for name,pattern in patterns.items():
              matches=re.findall(pattern, history)
              matches=[m for m in matches if (m if isinstance(m,str) else "".join(m)).strip()]
              count=len(matches)
              total += count
              print(f"SECRET_PATTERN_{name.upper()}={count}")
          print(f"SECRET_PATTERN_TOTAL={total}")
          PY

      - name: Inspect live security headers
        shell: bash
        run: |
          curl -sS -I https://murattab-pi.vercel.app/ > /tmp/headers.txt
          python - <<'PY'
          headers={}
          for line in open("/tmp/headers.txt",encoding="utf-8",errors="ignore"):
              if ":" in line:
                  k,v=line.split(":",1)
                  headers[k.strip().lower()]=v.strip()
          wanted=[
              "strict-transport-security",
              "content-security-policy",
              "x-content-type-options",
              "x-frame-options",
              "referrer-policy",
              "permissions-policy",
              "cross-origin-opener-policy",
              "cross-origin-resource-policy"
          ]
          for key in wanted:
              print(f"HEADER_{key.upper().replace('-','_')}={headers.get(key,'MISSING')}")
          PY

      - name: OWASP ZAP passive baseline
        shell: bash
        run: |
          docker run --rm -v "$PWD:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://murattab-pi.vercel.app/ -m 2 -I -J zap-report.json || true
          python - <<'PY'
          import json, os
          p="zap-report.json"
          if not os.path.exists(p):
              print("ZAP_REPORT_MISSING")
              raise SystemExit(0)
          data=json.load(open(p,encoding="utf-8"))
          alerts=[]
          for site in data.get("site",[]):
              alerts.extend(site.get("alerts",[]))
          counts={}
          for a in alerts:
              risk=str(a.get("riskdesc","Unknown")).split()[0]
              counts[risk]=counts.get(risk,0)+1
          print("ZAP_ALERT_COUNTS", json.dumps(counts,sort_keys=True))
          for a in alerts:
              risk=str(a.get("riskdesc","Unknown")).split()[0]
              name=str(a.get("name","")).replace("\n"," ")[:160]
              print(f"ZAP_ALERT {risk}: {name}")
          PY
